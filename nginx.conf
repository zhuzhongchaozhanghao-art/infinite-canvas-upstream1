server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only public R2 generated-image paths are forwarded, never arbitrary hosts.
    resolver 1.1.1.1 8.8.8.8;
    location ~ "^/image-source/(pub-[a-f0-9]{32})/(generated/.*)$" {
        set $image_host $1.r2.dev;
        set $image_path $2;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_name $image_host;
        proxy_set_header Host $image_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass https://$image_host/$image_path$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
